<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Flop Texture Trainer | Dry vs Wet & Static vs Dynamic</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Poker felt background gradient with subtle weave */
    .poker-felt {
      background: radial-gradient(circle at 50% 20%, #154726 0%, #0c2b17 55%, #06170c 100%);
    }
    .poker-table-border {
      box-shadow: inset 0 0 0 10px #2c1a0e, inset 0 0 25px rgba(0, 0, 0, 0.85), 0 20px 40px -10px rgba(0,0,0,0.7);
    }
    /* Playing card flip & deal animation */
    @keyframes cardDeal {
      0% { opacity: 0; transform: translateY(-40px) scale(0.9) rotate(-4deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    }
    .animate-card-1 { animation: cardDeal 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-card-2 { animation: cardDeal 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-card-3 { animation: cardDeal 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.6); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.8); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- TOP NAVIGATION BAR -->
  <header class="border-b border-slate-800 bg-slate-900/95 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-2 md:gap-4 py-2 md:py-0 md:h-16">
        
        <!-- Top Row on Mobile: Logo/Title & Mobile Controls -->
        <div class="flex items-center justify-between gap-2 w-full md:w-auto">
          <div class="flex items-center gap-2 sm:gap-3">
            <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 p-0.5 shadow-lg shadow-emerald-950/50 flex items-center justify-center font-bold text-slate-950 text-base sm:text-lg shrink-0">
              ♠️
            </div>
            <div>
              <div class="flex items-center gap-1.5 sm:gap-2">
                <span class="font-extrabold tracking-tight text-white text-base sm:text-xl">FlopMaster</span>
                <span class="text-[10px] sm:text-xs px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 font-semibold border border-emerald-500/30">GTO Trainer</span>
              </div>
              <p class="text-[11px] text-slate-400 hidden sm:block">Board Texture Classifier: Dry/Wet &bull; Static/Dynamic</p>
            </div>
          </div>

          <!-- Global Controls (Mobile) -->
          <div class="flex md:hidden items-center gap-1.5 shrink-0">
            <button id="toggle-deck-color-btn-m" title="Toggle 4-Color Deck" class="px-2 py-1 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-xs font-semibold text-slate-200 flex items-center gap-1 transition">
              <span class="flex gap-0.5 font-mono text-[10px]">
                <span class="text-slate-200">♠</span><span class="text-red-400">♥</span><span id="diamond-preview-icon-m" class="text-blue-400">♦</span><span id="club-preview-icon-m" class="text-emerald-400">♣</span>
              </span>
            </button>
            <button id="toggle-sound-btn-m" title="Toggle Sound" class="p-1.5 rounded-lg border border-slate-700 bg-slate-800/80 text-slate-300 hover:text-white transition">
              <svg id="sound-on-svg-m" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
              </svg>
              <svg id="sound-off-svg-m" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Tab Navigation (Horizontally scrollable on mobile, inline on desktop) -->
        <nav class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto pb-1 md:pb-0 scrollbar-none whitespace-nowrap -mx-1 px-1">
          <button id="nav-drill-btn" class="nav-tab active-tab px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all bg-emerald-500 text-slate-950 shadow shrink-0">
            Drill Mode
          </button>
          <button id="nav-challenge-btn" class="nav-tab px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all text-slate-300 hover:text-white hover:bg-slate-800 shrink-0">
            10-Card Challenge
          </button>
          <button id="nav-lab-btn" class="nav-tab px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all text-slate-300 hover:text-white hover:bg-slate-800 shrink-0">
            Custom Lab
          </button>
          <button id="nav-theory-btn" class="nav-tab px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all text-slate-300 hover:text-white hover:bg-slate-800 shrink-0">
            Theory & Matrix
          </button>
          <button id="nav-stats-btn" class="nav-tab px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all text-slate-300 hover:text-white hover:bg-slate-800 shrink-0">
            Stats & Review
          </button>
        </nav>

        <!-- Global Controls (Desktop) -->
        <div class="hidden md:flex items-center gap-2 shrink-0">
          <button id="toggle-deck-color-btn" title="Toggle 4-Color Deck" class="px-2.5 py-1.5 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-xs font-semibold text-slate-200 flex items-center gap-1.5 transition">
            <span class="flex gap-0.5 font-mono text-[11px]">
              <span class="text-slate-200">♠</span><span class="text-red-400">♥</span><span id="diamond-preview-icon" class="text-blue-400">♦</span><span id="club-preview-icon" class="text-emerald-400">♣</span>
            </span>
            <span id="deck-color-mode-text">4-Color</span>
          </button>

          <button id="toggle-sound-btn" title="Toggle Sound Effects" class="p-2 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition">
            <svg id="sound-on-svg" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            </svg>
            <svg id="sound-off-svg" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 lg:p-8 flex flex-col gap-4 sm:gap-6">

    <!-- ========================================== -->
    <!-- VIEW 1: DRILL / TRAINER MODE -->
    <!-- ========================================== -->
    <section id="view-drill" class="flex flex-col gap-4 sm:gap-6">
      
      <!-- Quick Control & Stats Bar (Mobile Optimized) -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-900/60 p-3 sm:p-3.5 rounded-2xl border border-slate-800">
        <div class="flex items-center justify-between sm:justify-start gap-2 sm:gap-4 text-xs sm:text-sm">
          <div>
            <span class="text-slate-400 text-[10px] sm:text-xs block">Streak</span>
            <div class="flex items-center gap-1">
              <span id="stat-streak-val" class="text-base sm:text-xl font-bold text-amber-400">0</span>
              <span class="text-amber-500 text-xs sm:text-base">🔥</span>
            </div>
          </div>
          <div class="h-6 sm:h-8 w-px bg-slate-800"></div>
          <div>
            <span class="text-slate-400 text-[10px] sm:text-xs block">Accuracy</span>
            <div id="stat-accuracy-val" class="text-base sm:text-xl font-bold text-emerald-400">--%</div>
          </div>
          <div class="h-6 sm:h-8 w-px bg-slate-800"></div>
          <div>
            <span class="text-slate-400 text-[10px] sm:text-xs block">Hands Dealt</span>
            <div id="stat-total-val" class="text-base sm:text-xl font-bold text-slate-200">0</div>
          </div>
        </div>

        <!-- Flop Type Filter Selector -->
        <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end pt-2 sm:pt-0 border-t border-slate-800 sm:border-t-0">
          <div class="flex items-center gap-1.5 flex-1 sm:flex-initial">
            <label for="drill-filter-select" class="text-xs text-slate-400 font-medium">Filter:</label>
            <select id="drill-filter-select" class="w-full sm:w-auto bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 sm:px-2.5 py-1.5 focus:ring-1 focus:ring-emerald-500 focus:outline-none">
              <option value="all">All Flops (Random)</option>
              <option value="dry_static">Pure Dry & Static</option>
              <option value="dry_dynamic">Dry & Dynamic (Low disconnected)</option>
              <option value="wet_dynamic">Wet & Dynamic (Draw heavy)</option>
              <option value="wet_static">Wet & Static (Monotone / Paired high)</option>
              <option value="monotone">Monotone Flops</option>
              <option value="twotone">Two-Tone Flops</option>
              <option value="rainbow">Rainbow Flops</option>
              <option value="paired">Paired Flops</option>
            </select>
          </div>
          <button id="deal-next-btn" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold text-xs shadow transition flex items-center gap-1 shrink-0 active:scale-95">
            <span>New Flop</span>
            <span class="opacity-60 text-[10px] hidden xs:inline">(Space)</span>
          </button>
        </div>
      </div>
